<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cloudland Hideaway — Site Plan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F6F1E2;
    --parchment-edge:#EDE4CC;
    --ink:#2E2A21;
    --ink-soft:#5B5342;
    --forest-deep:#3C5740;
    --path-edge:#C4A96F;
    --gold:#C4863A;
    --gold-soft:#E7C08A;
    --paper-shadow: rgba(60,50,30,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#EAE3CE;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }
  .wrap{ max-width:1180px; width:100%; }
  header{ text-align:center; margin-bottom:18px; }
  .eyebrow{
    letter-spacing:.28em; text-transform:uppercase; font-size:11px;
    color:var(--forest-deep); font-weight:600; margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:500; font-size:clamp(28px,4vw,42px);
    margin:0 0 6px; color:var(--ink);
  }
  .sub{ font-size:14px; color:var(--ink-soft); font-style:italic; font-family:'Fraunces', serif; }
  .stage{
    position:relative; background:var(--parchment); border-radius:18px;
    box-shadow:0 18px 40px -14px var(--paper-shadow), 0 2px 6px rgba(60,50,30,0.12);
    overflow:hidden; border:1px solid var(--parchment-edge);
  }
  .controls{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--parchment-edge);
  }
  .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .filters button{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.02em;
    padding:7px 14px; border-radius:999px; border:1px solid var(--path-edge);
    background:transparent; color:var(--ink-soft); cursor:pointer; transition:all .18s ease;
  }
  .filters button:hover{border-color:var(--gold);color:var(--ink);}
  .filters button.active{ background:var(--forest-deep); border-color:var(--forest-deep); color:#F6F1E2; }
  .hint{ font-size:12px; color:var(--ink-soft); font-style:italic; }
  .map-area{ display:flex; }
  .art-holder{ flex:1 1 auto; min-width:0; position:relative; line-height:0; }
  .art-holder img{ display:block; width:100%; height:auto; }
  .art-holder svg{ position:absolute; top:0; left:0; width:100%; height:100%; }
  .panel{ width:0; flex:0 0 auto; overflow:hidden; background:#FBF8EE; border-left:1px solid var(--parchment-edge); transition:width .28s ease; }
  .panel.open{width:300px;}
  .panel-inner{ padding:26px 24px; width:300px; }
  .panel-kicker{ font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:8px; }
  .panel h2{ font-family:'Fraunces', serif; font-weight:500; font-size:24px; margin:0 0 10px; color:var(--ink); }
  .panel p{ font-size:13.5px; line-height:1.65; color:var(--ink-soft); margin:0 0 16px; }
  .panel .close{ background:none; border:none; font-size:12px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; padding:0; }
  .panel-link{display:block;background:#C4863A;color:white;padding:13px 16px;border-radius:8px;text-align:center;text-decoration:none;font-size:13px;font-weight:600;margin:18px 0;}
.panel-link:hover{background:#A96F2D;}
.panel-link[hidden]{display:none;}
  .hotspot{ cursor:pointer; }
  .hotspot .ring{ fill:none; stroke:var(--gold); stroke-width:2.5; opacity:0; transition:opacity .2s ease, r .2s ease; }
  .hotspot .bloom{ fill:url(#bloomGrad); opacity:0; transition:opacity .3s ease; }
  .hotspot:hover .ring, .hotspot.active .ring{ opacity:1; }
  .hotspot:hover .bloom, .hotspot.active .bloom{ opacity:.6; }
  .hotspot .dot{ fill:var(--gold); opacity:0; transition:opacity .2s ease; }
  .hotspot:hover .dot{ opacity:.9; }
  .fade-out{opacity:.15; transition:opacity .25s ease;}
  .fade-in{opacity:1; transition:opacity .25s ease;}
  .legend{
    padding:14px 20px 18px; display:flex; gap:22px; flex-wrap:wrap;
    border-top:1px solid var(--parchment-edge); font-size:12px; color:var(--ink-soft);
  }
  .legend .item{display:flex; align-items:center; gap:7px;}
  .swatch{width:11px;height:11px;border-radius:50%;flex:0 0 auto; border:2px solid var(--gold);}
  footer{ text-align:center; margin-top:16px; font-size:11.5px; color:var(--ink-soft); }
  @media (max-width:760px){
    .panel.open{width:100%; position:absolute; inset:0; z-index:5;}
    .panel-inner{width:100%;}
    .map-area{position:relative;}
  }
.hotspot.category-glow .ring {
  opacity: 1;
  stroke: #FFD978;
  stroke-width: 4;
  filter: drop-shadow(0 0 6px #FFD978);
}

.hotspot.category-glow .bloom {
  opacity: 0.95;
}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Lookout Mountain, Georgia</div>
    <h1>Cloudland Hideaway</h1>
    <div class="sub">Escape · Elevate · Exhale</div>
  </header>

  <div class="stage">
    <div class="controls">
      <div class="filters" id="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="storm">Storm</button>
        <button data-filter="cloud">Cloud Cabins</button>
        <button data-filter="moon">Moon Cabins</button>
        <button data-filter="amenity">Amenities</button>
      </div>
      <div class="hint">Tap a marker for details</div>
    </div>

    <div class="map-area">
      <div class="art-holder">
        <img src="site-plan-art.svg" alt="Cloudland Hideaway site plan">
        <svg id="hotspotSvg" viewBox="0 0 1388.25 1268.999945" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="bloomGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#E7C08A" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#E7C08A" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g id="hotspotLayer"></g>
        </svg>
      </div>

      <div class="panel" id="panel">
        <div class="panel-inner">
          <div class="panel-kicker" id="panelKicker">Cloud Cabin</div>
          <h2 id="panelTitle">—</h2>
          <p id="panelBody">—</p>
          <a id="panelLink" class="panel-link" href="#" target="_top" hidden>Explore Cabin</a>
          <button class="close" id="panelClose">Close</button>
        </div>
      </div>
    </div>

    <div class="legend">
      <div class="item"><span class="swatch"></span> Tap any marker for cabin &amp; amenity details</div>
    </div>
  </div>

  <footer>Illustrated site plan · for interactive use on the Cloudland Hideaway website</footer>
</div>

<script>
(function(){
  const svgNS = "http://www.w3.org/2000/svg";
  const hotspotLayer = document.getElementById('hotspotLayer');
  function el(tag, attrs, parent){
    const e = document.createElementNS(svgNS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    if(parent) parent.appendChild(e);
    return e;
  }

  // coordinates read directly off the artwork, in the SVG's own 1388.25 x 1269 space
  const spots = [
    {key:'gym', x:788, y:90, r:26, cat:'amenity', name:'Wellness Gym', desc:'The fitness and wellness building at the top of the property, along the upper hiking trail.'},
    {key:'firepit1', x:657, y:268, r:20, cat:'amenity', name:'Fire Pit', desc:'An open-air fire pit set on the walkway between the Wellness Gym and Cloud Cabin Cumulus.'},
    {key:'cumulus', x:748, y:394, r:30, cat:'cloud', name:'Cloud Cabin · Cumulus', desc:'Positioned along the upper driveway, surrounded by woodland near the northern end of the property.'},
    {key:'sauna1', x:603, y:370, r:20, cat:'amenity', name:'Sauna', desc:'Wood-fired sauna tucked between the Pool and the Cloud Cabin cluster.'},
    {key:'mooncabin1', x:901, y:416, r:24, cat:'moon', name:'Moon Cabin Eclipse', desc:'Nestled along the upper eastern driveway, just beyond Cumulus, in a quiet wooded setting.'},
    {key:'stratus', x:676, y:525, r:30, cat:'cloud', name:'Cloud Cabin · Stratus', desc:'Positioned between Storm and Cumulus, with convenient access to the infinity pool and sauna.'},
    {key:'mooncabin2', x:804, y:556, r:24, cat:'moon', name:'Moon Cabin Halo', desc:'Tucked among the trees east of Stratus, with access to the walkway connecting to the driveway.'},
    {key:'firepit2', x:222, y:555, r:20, cat:'amenity', name:'Fire Pit', desc:'A second fire pit near the western Sauna and the walkway to the Pool.'},
    {key:'pool', x:495, y:567, r:34, cat:'amenity', name:'Pool', desc:'The central pool, an easy walk from the Cloud Cabins and Cabin Storm.'},
    {key:'sauna2', x:325, y:587, r:20, cat:'amenity', name:'Sauna', desc:'A second sauna along the western walkway, near the Fire Pit.'},
    {key:'nimbus', x:237, y:685, r:28, cat:'cloud', name:'Cloud Cabin · Nimbus', desc:'Tucked among the trees along the western driveway, Nimbus offers a secluded setting near Cirrus.'},
    {key:'cirrus', x:397, y:707, r:28, cat:'cloud', name:'Cloud Cabin · Cirrus', desc:'Situated beside Nimbus along the western driveway, with convenient access to the walkway leading toward the infinity pool.'},
    {key:'storm', x:540, y:690, r:36, cat:'storm', name:'Cabin Storm', desc:'Our spacious two-bedroom flagship cabin, positioned near the center of the property with convenient access to the shared amenities.'},
    {key:'mooncabin3', x:969, y:740, r:24, cat:'moon', name:'Moon Cabin Crescent', desc:'Set among the trees near the eastern parking area, with convenient access to the property walking paths.'},
    {key:'mooncabin4', x:245, y:902, r:24, cat:'moon', name:'Moon Cabin Luna', desc:'Nestled along the western walking trail, Luna offers a peaceful, secluded setting surrounded by nature.'},
    {key:'common', x:667, y:873, r:34, cat:'amenity', name:'Common House', desc:'The heart of the Hideaway — shared gathering space, kitchen, and check-in.'},
    {key:'utility', x:588, y:992, r:24, cat:'amenity', name:'Utility House', desc:'Back-of-house storage and mechanical space near the Common House.'},
    {key:'pickleball', x:581, y:1090, r:34, cat:'amenity', name:'Pickleball Court', desc:'South of the Common House, along the hiking trail loop.'}
  ];

  const registry = {};
  const panel = document.getElementById('panel');
  const panelTitle = document.getElementById('panelTitle');
  const panelBody = document.getElementById('panelBody');
  const panelLink = document.getElementById('panelLink');
  const panelKicker = document.getElementById('panelKicker');
  const kickerNames = {cloud:'Cloud Cabin', moon:'Moon Cabin', storm:'Flagship Cabin', amenity:'On the Property'};
  let activeKey = null;
  const websiteUrl = 'https://www.cloudlandhideaway.com';
const cabinLinks = {storm:'/storm',nimbus:'/nimbus',cirrus:'/cirrus',stratus:'/stratus',cumulus:'/cumulus',mooncabin1:'/eclipse',mooncabin2:'/halo',mooncabin3:'/crescent',mooncabin4:'/luna'};
  const amenityLinks = {
  gym: {anchor:'saunagym', label:'Explore the Wellness Gym'},
  firepit1: {anchor:'pickleballfirepit', label:'Explore the Fire Pits'},
  firepit2: {anchor:'pickleballfirepit', label:'Explore the Fire Pits'},
  sauna1: {anchor:'saunagym', label:'Explore the Saunas'},
  sauna2: {anchor:'saunagym', label:'Explore the Saunas'},
  pool: {anchor:'pool', label:'Explore the Pool'},
  common: {anchor:'commonhouse', label:'Explore the Common House'},
  pickleball: {anchor:'pickleballfirepit', label:'Explore Pickleball'}
};

  spots.forEach(function(s){
    registry[s.key] = s;
    const g = el('g', {class:'node hotspot', 'data-cat':s.cat, 'data-key':s.key}, hotspotLayer);
    el('circle', {cx:s.x, cy:s.y, r:s.r*1.7, class:'bloom'}, g);
    el('circle', {cx:s.x, cy:s.y, r:s.r, class:'ring'}, g);
    el('circle', {cx:s.x, cy:s.y, r:3.5, class:'dot'}, g);
    el('circle', {cx:s.x, cy:s.y, r:s.r, fill:'transparent'}, g);
    g.addEventListener('click', function(){ selectNode(s.key); });
  });

  function selectNode(key){
    if(activeKey === key){ closePanel(); return; }
    activeKey = key;
    document.querySelectorAll('.hotspot').forEach(function(n){
      n.classList.toggle('active', n.getAttribute('data-key') === key);
    });
    const o = registry[key];
    panelKicker.textContent = kickerNames[o.cat] || 'On the Property';
    panelTitle.textContent = o.name;
    panelBody.textContent = o.desc || '';
    if(cabinLinks[key]){
  panelLink.href = websiteUrl + cabinLinks[key];
  panelLink.textContent = 'Explore Cabin';
  panelLink.hidden = false;
}else if(amenityLinks[key]){
  panelLink.href = websiteUrl + '/experiences#' + amenityLinks[key].anchor;
  panelLink.textContent = amenityLinks[key].label;
  panelLink.hidden = false;
}else{
  panelLink.hidden = true;
}
    panel.classList.add('open');
  }
  function closePanel(){
    activeKey = null;
    document.querySelectorAll('.hotspot').forEach(function(n){ n.classList.remove('active'); });
    panel.classList.remove('open');
  }
  document.getElementById('panelClose').addEventListener('click', closePanel);

  const filterButtons = document.querySelectorAll('#filters button');
  filterButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      filterButtons.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      const f = btn.getAttribute('data-filter');
      document.querySelectorAll('.hotspot').forEach(function(n){
        const cat = n.getAttribute('data-cat');
        const show = (f === 'all') || (cat === f);
        n.classList.toggle('fade-out', !show);
        n.classList.toggle('fade-in', show);
        n.classList.toggle('category-glow', f !== 'all' && cat === f);
      });
    });
  });
})();
</script>
</body>
</html>
